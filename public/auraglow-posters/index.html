<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوستر ميكس زيوت تكثيف الشعر — أوراجلو</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #F4F1EA;
      font-family: 'Cairo', sans-serif;
      color: #213421;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 18px;
    }
    .bar {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: #fff;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid #DFD7C8;
    }
    .bar h1 { margin: 0; font-size: 1.05rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #213421;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 10px 20px;
      border-radius: 10px;
    }
    .preview {
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      box-shadow: 0 18px 44px rgba(33, 52, 33, 0.16);
      display: block;
    }
  </style>
</head>
<body>
  <div class="bar">
    <h1>بوستر ميكس زيوت تكثيف الشعر — أوراجلو (جودة عالية 2160×2700)</h1>
    <a class="btn" href="./hair-thickening-oil-poster.jpg" download="Auraglow-Hair-Thickening-Oil-Poster.jpg">تحميل الصورة بجودة عالية (JPG)</a>
  </div>
  <img class="preview" src="./hair-thickening-oil-poster.jpg" alt="بوستر ميكس زيوت تكثيف الشعر من أوراجلو" />
</body>
</html>
